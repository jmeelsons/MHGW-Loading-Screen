<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNB-RU - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0808;
            color: #d4c9c9;
            font-family: 'Bahnschrift', 'Roboto', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            padding: 20px;
        }
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #2a1818, #0a0505 80%);
            z-index: -2;
        }
        .bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(180,40,40,0.015) 0px, rgba(180,40,40,0.015) 1px, transparent 1px, transparent 3px);
            pointer-events: none;
        }

        .card {
            max-width: 720px;
            width: 100%;
            background: rgba(18, 12, 12, 0.92);
            backdrop-filter: blur(4px);
            padding: 40px 40px 32px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(80,10,10,0.6), inset 0 1px 1px rgba(200,60,60,0.06);
            border: 1px solid rgba(160,40,40,0.15);
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(160,40,40,0.15);
            padding-bottom: 18px;
        }
        .logo {
            font-weight: 500;
            font-size: 24px;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #e0b8b8, #b88080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .badge {
            font-size: 12px;
            padding: 6px 14px;
            background: rgba(160,40,40,0.12);
            border-radius: 40px;
            color: #b88080;
            border: 1px solid rgba(160,40,40,0.15);
            letter-spacing: 0.3px;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 24px;
            justify-content: space-between;
        }
        .server-info {
            flex: 1 1 220px;
        }
        .server-info h3 {
            font-weight: 400;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a06060;
            margin-bottom: 12px;
        }
        .server-info p {
            font-size: 14px;
            line-height: 1.6;
            color: #c4a8a8;
            margin-bottom: 6px;
            font-weight: 300;
        }
        .server-info .highlight {
            color: #d4906a;
            font-weight: 400;
        }

        .music-block {
            flex: 1 1 200px;
            min-width: 180px;
            background: rgba(80,20,20,0.15);
            border-radius: 18px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(160,40,40,0.08);
        }
        .music-block:hover {
            background: rgba(120,30,30,0.2);
            box-shadow: 0 0 0 1px rgba(200,80,80,0.15);
        }
        .cover {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: #1a0e0e;
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #a06060;
            border: 1px solid rgba(160,40,40,0.1);
        }
        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .track-meta {
            flex: 1;
            min-width: 0;
        }
        .track-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #805050;
            margin-bottom: 4px;
        }
        .track-name {
            font-weight: 400;
            font-size: 15px;
            color: #e0c8c8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.2s;
        }
        .track-name.playing {
            color: #d4906a;
        }
        .track-time {
            font-size: 12px;
            color: #805050;
            font-variant-numeric: tabular-nums;
            margin-top: 4px;
        }
        .mini-progress {
            width: 100%;
            height: 2px;
            background: rgba(160,40,40,0.15);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }
        .mini-progress-fill {
            height: 100%;
            width: 0%;
            background: #d4906a;
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .illustration-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(60,20,20,0.15);
            border-radius: 40px;
            padding: 10px 20px 10px 24px;
            border: 1px solid rgba(160,40,40,0.08);
        }
        .illustration-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #805050;
        }
        .illustration-name {
            font-weight: 400;
            font-size: 16px;
            color: #d4c0c0;
            letter-spacing: 0.2px;
        }
        .illustration-counter {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #805050;
        }
        .dots {
            display: flex;
            gap: 6px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 20px;
            background: #3a2020;
            transition: background 0.25s, width 0.25s;
            cursor: pointer;
        }
        .dot.active {
            background: #d4906a;
            width: 20px;
        }

        .progress-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #a06060;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
        .bar {
            width: 100%;
            height: 6px;
            background: #1a0e0e;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
            border: 1px solid rgba(160,40,40,0.08);
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6d3b3b, #d4906a);
            border-radius: 40px;
            transition: width 0.15s ease;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6a4040;
            letter-spacing: 0.3px;
            padding-top: 6px;
            border-top: 1px solid rgba(160,40,40,0.08);
        }
        .footer span:last-child {
            color: #8a5a5a;
            font-weight: 300;
        }

        .illustration-name.changing {
            animation: flicker 0.25s ease;
        }
        @keyframes flicker {
            0% { opacity: 1; }
            30% { opacity: 0.3; transform: translateX(-3px); }
            70% { opacity: 0.7; transform: translateX(2px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 600px) {
            .card { padding: 28px 20px; }
            .header { flex-direction: column; align-items: start; gap: 8px; }
            .logo { font-size: 20px; }
            .grid { flex-direction: column; }
            .music-block { flex: 1; }
            .illustration-row { flex-wrap: wrap; gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="card">
        <div class="header">
            <span class="logo">SNB-RU</span>
            <span class="badge">загрузка</span>
        </div>

        <div class="grid">
            <div class="server-info">
                <h3>о сервере</h3>
                <p>SNB-RU — довольно старый Sandbox сервер на базе Z-City.</p>
                <p style="font-size:13px; color:#805050;">приятных лагов и зависаний!</p>
            </div>

            <div class="music-block" id="musicBlock" title="нажми, чтобы переключить трек">
                <div class="cover" id="coverContainer">
                    <img id="coverImg" src="" alt="cover" style="display:none;">
                    <span id="coverFallback" style="display:flex;">🎵</span>
                </div>
                <div class="track-meta">
                    <div class="track-label">медиа-плеер</div>
                    <div class="track-name" id="trackDisplay">загрузка...</div>
                    <div class="track-time" id="trackTime">00:00</div>
                    <div class="mini-progress">
                        <div class="mini-progress-fill" id="trackProgress"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="illustration-row">
            <span class="illustration-label">иллюстрации</span>
            <span class="illustration-name" id="illustrationName">загрузка...</span>
            <span class="illustration-counter">
                <span id="imageCounter">01/08</span>
                <span class="dots" id="dotsContainer"></span>
            </span>
        </div>

        <div class="progress-area">
            <div class="progress-header">
                <span>загрузка ресурсов</span>
                <span id="percentText">0%</span>
            </div>
            <div class="bar">
                <div class="bar-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="footer">
            <span id="tipText">инициализация...</span>
            <span id="fileText">ожидание...</span>
        </div>
    </div>

    <script>
        (function() {
            const images = [
                { url: 'https://cdnn21.img.ria.ru/images/07e8/0b/1c/1986171481_0:0:1536:1024_1440x0_80_0_0_c5d81ba7db32fc44ccf677d5abafcf7c.jpg', name: 'Первая чеченская (1994–1999)' },
                { url: 'https://anna-news.info/wp-content/uploads/2024/12/11/2100/zasada.jpg', name: 'Первая чеченская (1994–1999)' },
                { url: 'https://cdn-storage-media.tass.ru/resize/1312x868/tass_media/2022/03/07/v/1646644831987940_v8Vctfdx.jpg', name: 'Вторая чеченская (1999–2009)' },
                { url: 'https://im2.kommersant.ru/Issues.photo/CORP/2014/04/16/KMO_096855_04930_1_t218_150838.jpg', name: 'Вторая чеченская (1999–2009)' },
                { url: 'https://cdn5.vedomosti.ru/image/2024/9y/rk8t4/original-zq0.jpg', name: 'Афганская война (1980–1989)' },
                { url: 'https://podrobno.uz/upload/iblock/ca7/rlharwfz7kvvjh9r7zoxqj0z8d31m842/photo_2026_02_14_18_12_37.jpg', name: 'Афганская война (1980–1989)' },
                { url: 'https://sh32-stavropol-r07.gosweb.gosuslugi.ru/netcat_files/178/2851/scale_1200_4.jpg', name: 'Великая Отечественная (1941–1945)' },
                { url: 'https://i.siteapi.org/n1b0yUufCq3MuquQAlPLKjL8YkI=/0x36:1200x630/s.siteapi.org/2c079b90a0950c6/img/lp3865b13kgcg808cwc4g0sg08osgc', name: 'Великая Отечественная (1941–1945)' }
            ];

            const illustrName = document.getElementById('illustrationName');
            const counterSpan = document.getElementById('imageCounter');
            const dotsContainer = document.getElementById('dotsContainer');
            const progressFill = document.getElementById('progressFill');
            const percentText = document.getElementById('percentText');
            const fileText = document.getElementById('fileText');
            const tipText = document.getElementById('tipText');

            const trackDisplay = document.getElementById('trackDisplay');
            const trackTime = document.getElementById('trackTime');
            const trackProgress = document.getElementById('trackProgress');
            const musicBlock = document.getElementById('musicBlock');
            const coverImg = document.getElementById('coverImg');
            const coverFallback = document.getElementById('coverFallback');

            const trackList = [
                { file: 'music/track1.mp3', label: 'Aphex Twin - Xtal', cover: 'https://imagine-club.com/sites/default/files/styles/product_zoom/public/photos/selected_ambient_works_85-92_aphex_twin_2_lp_apollo_eu_0.jpg?itok=TDDbXnpU' },
                { file: 'music/track2.mp3', label: 'Aphex Twin - Pulsewidth', cover: 'https://imagine-club.com/sites/default/files/styles/product_zoom/public/photos/selected_ambient_works_85-92_aphex_twin_2_lp_apollo_eu_0.jpg?itok=TDDbXnpU' },
                { file: 'music/track3.mp3', label: 'Aphex Twin - IZ-US', cover: 'https://avatars.mds.yandex.net/i?id=665a0d6158de82f828094cdcd9482408_l-8710632-images-thumbs&n=13' },
                { file: 'music/track4.mp3', label: 'Aphex Twin — Heliospahn', cover: 'https://imagine-club.com/sites/default/files/styles/product_zoom/public/photos/selected_ambient_works_85-92_aphex_twin_2_lp_apollo_eu_0.jpg?itok=TDDbXnpU' },
                { file: 'music/track5.mp3', label: 'Aphex Twin — Flim', cover: 'https://avatars.mds.yandex.net/i?id=665a0d6158de82f828094cdcd9482408_l-8710632-images-thumbs&n=13' },
                { file: 'music/track6.mp3', label: 'Aphex Twin — Delphium', cover: 'https://imagine-club.com/sites/default/files/styles/product_zoom/public/photos/selected_ambient_works_85-92_aphex_twin_2_lp_apollo_eu_0.jpg?itok=TDDbXnpU' },
                { file: 'music/track7.mp3', label: 'Aphex Twin - Alberto Balsalm', cover: 'https://i.ytimg.com/vi/hiVieBPzY7c/oar2.jpg?usqp=CCk' },
                { file: 'music/track8.mp3', label: 'Aphex Twin - Actium', cover: 'https://imagine-club.com/sites/default/files/styles/product_zoom/public/photos/selected_ambient_works_85-92_aphex_twin_2_lp_apollo_eu_0.jpg?itok=TDDbXnpU' },
                { file: 'music/track9.mp3', label: 'Aphex Twin - 180db_', cover: 'https://avatars.mds.yandex.net/i?id=359e2c70e9e0c8a204cd48982cdecbf8_l-5350134-images-thumbs&n=13' }
            ];

            const audio = new Audio();
            audio.volume = 0.05;

            let currentTrackIndex = 0;
            let isPlaying = false;
            let progressInterval = null;

            function formatTime(sec) {
                if (isNaN(sec) || !isFinite(sec)) return '00:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }

            function updateCover(url) {
                if (url) {
                    coverImg.style.display = 'block';
                    coverFallback.style.display = 'none';
                    coverImg.src = url;
                    coverImg.onerror = () => {
                        coverImg.style.display = 'none';
                        coverFallback.style.display = 'flex';
                    };
                } else {
                    coverImg.style.display = 'none';
                    coverFallback.style.display = 'flex';
                }
            }

            function updateTrackDisplay(track) {
                trackDisplay.textContent = track.label;
                trackDisplay.className = 'track-name playing';
                updateCover(track.cover);
            }

            function startProgressUpdates() {
                clearInterval(progressInterval);
                progressInterval = setInterval(() => {
                    if (audio.duration && !isNaN(audio.duration)) {
                        const pct = (audio.currentTime / audio.duration) * 100;
                        trackProgress.style.width = Math.min(pct, 100) + '%';
                        trackTime.textContent = formatTime(audio.currentTime);
                    }
                }, 200);
            }

            function playTrack(index) {
                const track = trackList[index];
                if (!track) return;

                audio.pause();
                clearInterval(progressInterval);

                updateTrackDisplay(track);
                trackTime.textContent = '00:00';
                trackProgress.style.width = '0%';

                audio.src = track.file;
                audio.load();

                audio.play().then(() => {
                    isPlaying = true;
                    startProgressUpdates();
                }).catch((err) => {
                    console.warn('Не удалось воспроизвести:', track.file, err);
                    trackDisplay.textContent = '⚠ ' + track.label;
                    trackDisplay.className = 'track-name';
                });

                audio.onended = () => {
                    clearInterval(progressInterval);
                    nextTrack();
                };

                audio.onerror = () => {
                    clearInterval(progressInterval);
                    console.warn('Ошибка загрузки:', track.file);
                    setTimeout(() => nextTrack(), 2000);
                };
            }

            function nextTrack() {
                currentTrackIndex = (currentTrackIndex + 1) % trackList.length;
                playTrack(currentTrackIndex);
            }

            musicBlock.addEventListener('click', (e) => {
                e.stopPropagation();
                nextTrack();
            });

            setTimeout(() => {
                if (trackList.length > 0) {
                    playTrack(0);
                }
            }, 600);

            let currentIndex = 0;
            let slideTimer;

            images.forEach((_, i) => {
                const dot = document.createElement('span');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                dot.dataset.index = i;
                dot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    switchTo(i);
                });
                dotsContainer.appendChild(dot);
            });

            function switchTo(index) {
                if (index === currentIndex) return;
                currentIndex = index;
                const img = images[index];
                illustrName.textContent = img.name;
                illustrName.classList.remove('changing');
                void illustrName.offsetWidth;
                illustrName.classList.add('changing');

                const display = String(index + 1).padStart(2, '0');
                const total = String(images.length).padStart(2, '0');
                counterSpan.textContent = `${display}/${total}`;

                document.querySelectorAll('.dot').forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });
                resetSlideTimer();
            }

            function nextSlide() {
                const next = (currentIndex + 1) % images.length;
                switchTo(next);
            }

            function resetSlideTimer() {
                clearInterval(slideTimer);
                slideTimer = setInterval(nextSlide, 8000);
            }

            switchTo(0);

            let totalFiles = 50;
            let totalCalled = false;
            let percentage = 0;
            let downloadHistory = [];

            function setFilesTotal(total) {
                totalCalled = true;
                totalFiles = total;
                updateProgressDisplay();
            }

            function setFilesNeeded(needed) {
                if (totalCalled && totalFiles > 0) {
                    const pct = Math.min(100, Math.max(0, 100 - Math.round((needed / totalFiles) * 100)));
                    percentage = pct;
                    updateProgressDisplay();
                }
            }

            function downloadingFile(filename) {
                if (filename) {
                    const clean = filename.replace(/'/g, '').replace(/\?/g, '');
                    downloadHistory.unshift(clean);
                    if (downloadHistory.length > 10) downloadHistory.pop();
                    fileText.textContent = clean;
                }
                if (percentage < 95) {
                    percentage = Math.min(95, percentage + 0.3);
                    updateProgressDisplay();
                }
            }

            function setStatusChanged(status) {
                if (status === 'Workshop Complete') {
                    percentage = Math.max(percentage, 80);
                    updateProgressDisplay();
                } else if (status === 'Client info sent!') {
                    percentage = Math.max(percentage, 95);
                    updateProgressDisplay();
                } else if (status === 'Starting Lua...') {
                    percentage = 100;
                    updateProgressDisplay();
                } else {
                    if (percentage < 90) {
                        percentage = Math.min(90, percentage + 0.5);
                        updateProgressDisplay();
                    }
                }
                tipText.textContent = `[ статус ] ${status}`;
            }

            function updateProgressDisplay() {
                const pct = Math.floor(percentage);
                percentText.textContent = pct + '%';
                progressFill.style.width = percentage + '%';
                if (percentage >= 100) {
                    fileText.textContent = 'загрузка завершена!';
                }
            }

            const tips = [
                'инициализация...',
                'загрузка Lua-скриптов',
                'подключение к мастер-серверу',
                'намазываем на бутерброд',
                'инициализация аудиодрайвера'
            ];
            let tipIdx = 0;
            setInterval(() => {
                tipIdx = (tipIdx + 1) % tips.length;
                tipText.textContent = tips[tipIdx];
            }, 3200);

            window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
                if (Config && Config.title) {
                    document.querySelector('.logo').textContent = Config.title;
                } else if (servername) {
                    document.querySelector('.logo').textContent = servername;
                }
            };

            window.SetFilesTotal = setFilesTotal;
            window.SetFilesNeeded = setFilesNeeded;
            window.DownloadingFile = downloadingFile;
            window.SetStatusChanged = setStatusChanged;

            let isGmod = false;
            setTimeout(function() {
                if (!isGmod) {
                    setFilesTotal(100);
                    let needed = 100;
                    const interval = setInterval(() => {
                        if (needed > 0) {
                            needed = needed - 1;
                            setFilesNeeded(needed);
                            downloadingFile('test_file_' + needed + '.lua');
                            if (needed % 10 === 0) {
                                setStatusChanged('Загружено ' + (100 - needed) + ' файлов');
                            }
                        } else {
                            clearInterval(interval);
                            setStatusChanged('Starting Lua...');
                            setFilesNeeded(0);
                            fileText.textContent = 'все файлы загружены!';
                        }
                    }, 150);
                    document.querySelector('.badge').textContent = 'by Freak-Dev';
                }
            }, 1000);

            if (typeof SetFilesTotal === 'function') {
                isGmod = true;
                document.querySelector('.badge').textContent = 'by Freak-Dev';
            }

            setTimeout(() => {
                if (percentage === 0) {
                    percentage = 5;
                    updateProgressDisplay();
                }
            }, 500);

        })();
    </script>
</body>
</html>
